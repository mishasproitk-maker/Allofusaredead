<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>Хёсан — школьная жизнь</title>
<style>
:root {
  --bg: #0d0d0d; --bg-elev: #1a1a1a; --bg-input: #242424;
  --bg-bubble-npc: #2a2a2a; --bg-bubble-me: #2a5b7a;
  --text: #f0f0f0; --text-dim: #8a8a8a; --accent: #e53935; --border: #2a2a2a;
  --radius: 16px; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  --header-h: 56px; --tabbar-h: 70px;
  --card-bg: #ffffff; --card-text: #111; --card-text-dim: #666; --card-border: #e0e0e0;
  --rel-blue: #4a90e2; --rel-green: #34c759; --rel-pink: #ff2d55; --rel-red: #ff3b30;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
#app { display: flex; flex-direction: column; height: 100dvh; }
.screen { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding-top: var(--safe-top); }
.tabbar { display: flex; height: calc(var(--tabbar-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); border-top: 1px solid var(--border); background: var(--bg-elev); flex-shrink: 0; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-dim); font-size: 11px; transition: color 0.2s; }
.tab.active { color: var(--text); }
.tab-icon { font-size: 22px; }
.tab-label { font-size: 10px; font-weight: 500; }
.home-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 16px; padding: 20px; overflow-y: auto; }
.app-icon-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.app-icon { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.app-icon.tg { background: linear-gradient(135deg, #2AABEE, #229ED9); }
.app-icon.ig { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
.app-icon.tw { background: #000; border: 1px solid #333; }
.app-icon.stats { background: linear-gradient(135deg, #4facfe, #00f2fe); }
.app-name { font-size: 12px; color: var(--text); font-weight: 500; }
.home-header { padding: 20px 20px 10px; }
.home-header h2 { margin: 0 0 4px; font-size: 22px; }
.home-header p { margin: 0; color: var(--text-dim); font-size: 13px; }
.page-header { padding: 16px 20px 8px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
.page-header h1 { margin: 0; font-size: 24px; font-weight: 700; flex: 1; }
.back-btn-header { font-size: 24px; color: var(--accent); padding-right: 8px; }
.list-container { flex: 1; overflow-y: auto; padding: 8px 0; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); cursor: pointer; }
.list-item:active { background: var(--bg-elev); }
.avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #333; }
.list-info { flex: 1; min-width: 0; }
.list-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
.list-desc { color: var(--text-dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; height: var(--header-h); border-bottom: 1px solid var(--border); background: var(--bg-elev); flex-shrink: 0; }
.chat-header .avatar { width: 36px; height: 36px; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.35; word-wrap: break-word; white-space: pre-wrap; }
.msg.npc { align-self: flex-start; background: var(--bg-bubble-npc); border-bottom-left-radius: 4px; }
.msg.me { align-self: flex-end; background: var(--bg-bubble-me); border-bottom-right-radius: 4px; }
.typing { align-self: flex-start; color: var(--text-dim); font-style: italic; font-size: 13px; padding: 6px 14px; }
.input-bar { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--bg-elev); padding-bottom: calc(8px + var(--safe-bottom)); flex-shrink: 0; }
.input-bar input { flex: 1; background: var(--bg-input); border: none; border-radius: 20px; padding: 10px 16px; color: var(--text); font-size: 15px; outline: none; }
.send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: white; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.profile-wrapper { padding: 16px; overflow-y: auto; flex: 1; background: var(--bg); }
.profile-card { background: var(--card-bg); color: var(--card-text); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 16px; }
.profile-top { display: flex; gap: 16px; margin-bottom: 16px; }
.profile-top .avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--card-border); }
.profile-title h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
.profile-title .handle { color: var(--card-text-dim); font-size: 14px; margin-bottom: 8px; }
.status-badge { display: inline-block; background: #e6f0ff; color: #0056b3; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }
.profile-desc { font-size: 14px; color: var(--card-text-dim); margin-bottom: 16px; line-height: 1.4; }
.profile-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.btn-action { background: #f0f4f8; color: var(--card-text); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; border: 1px solid var(--card-border); }
.btn-action.primary { background: #e6f0ff; color: #0056b3; border-color: #b3d4ff; }
.rel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }
.rel-header h3 { margin: 0; font-size: 16px; font-weight: 700; }
.rel-badge { background: #e6f0ff; color: #0056b3; padding: 2px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; }
.rel-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 14px; }
.rel-label { width: 100px; font-weight: 600; }
.rel-bar-bg { flex: 1; height: 8px; background: #edf2f7; border-radius: 4px; margin: 0 12px; overflow: hidden; }
.rel-bar-fill { height: 100%; border-radius: 4px; }
.rel-value { width: 50px; text-align: right; font-weight: 600; color: var(--card-text-dim); font-size: 13px; }
.romance-block { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--card-border); font-size: 14px; }
.romance-block b { display: block; margin-bottom: 4px; }
.romance-warning { color: #d32f2f; font-weight: 600; }
.world-scene { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.scene-line { font-size: 14px; line-height: 1.5; color: #d0d0d0; padding: 6px 0; }
.scene-line.action { font-style: italic; color: #a0a0a0; border-left: 2px solid #555; padding-left: 10px; }
.scene-line.npc-speech { background: var(--bg-bubble-npc); border-radius: 12px; padding: 10px 14px; align-self: flex-start; max-width: 90%; }
.scene-line.npc-speech b { color: var(--accent); display: block; font-size: 12px; margin-bottom: 4px; }
.scene-line.player-action { background: rgba(42,91,122,0.3); border-radius: 12px; padding: 10px 14px; align-self: flex-end; max-width: 90%; font-style: italic; }
.feed { flex: 1; overflow-y: auto; }
.post { background: var(--bg-elev); margin-bottom: 12px; padding: 12px; border-radius: 12px; }
.post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.post-header .avatar { width: 32px; height: 32px; }
.post-author { font-weight: 600; font-size: 14px; }
.post-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: #222; }
.post-text { font-size: 14px; line-height: 1.4; margin-bottom: 8px; }
.post-actions { display: flex; gap: 16px; color: var(--text-dim); font-size: 13px; align-items: center; }
.like-btn { color: var(--text-dim); font-size: 20px; }
.like-btn.liked { color: var(--accent); }
.comments { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.comment { font-size: 13px; margin-bottom: 6px; line-height: 1.4; }
.comment b { color: var(--text); margin-right: 6px; }
.comment.me b { color: #4fc3f7; }
.comment-input { display: flex; gap: 8px; margin-top: 8px; }
.comment-input input { flex: 1; background: var(--bg-input); border: none; border-radius: 16px; padding: 8px 14px; color: var(--text); font-size: 13px; outline: none; }
.comment-input button { color: #4fc3f7; font-size: 13px; font-weight: 600; }
.messages::-webkit-scrollbar, .list-container::-webkit-scrollbar, .feed::-webkit-scrollbar, .profile-wrapper::-webkit-scrollbar, .home-grid::-webkit-scrollbar, .world-scene::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="app">
  <main id="screen" class="screen"></main>
  <nav id="tabbar" class="tabbar">
    <button class="tab active" data-tab="home"><span class="tab-icon">🏠</span><span class="tab-label">Главная</span></button>
    <button class="tab" data-tab="chats"><span class="tab-icon">💬</span><span class="tab-label">Чаты</span></button>
    <button class="tab" data-tab="instagram"><span class="tab-icon">📸</span><span class="tab-label">Instagram</span></button>
    <button class="tab" data-tab="twitter"><span class="tab-icon">🐦</span><span class="tab-label">Twitter</span></button>
    <button class="tab" data-tab="world"><span class="tab-icon">🏫</span><span class="tab-label">Школа</span></button>
  </nav>
</div>
<script>
const CHARACTERS = {
  cheongsan: { id: 'cheongsan', name: 'Ли Чон-сан', shortName: 'Чон-сан', photo: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200&h=200&fit=crop&crop=faces', handle: '@cheongsan_2_5', desc: 'Верный, храбрый, немного неуклюжий. Защитит любого.', initialRelationships: { friendship: 20, trust: 10, respect: 15, sympathy: 10, romance: 0, irritation: 5, hostility: 0, familiarity: 30 }, greeting: 'О, привет! Ты новенький, да? Я Чон-сан. Если что — обращайся.' },
  onjo: { id: 'onjo', name: 'Нам Он-джо', shortName: 'Он-джо', photo: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop&crop=faces', handle: '@onjo_sunny', desc: 'Добрая и внимательная. Горячий чай и тёплые слова.', initialRelationships: { friendship: 25, trust: 15, respect: 10, sympathy: 15, romance: 0, irritation: 0, hostility: 0, familiarity: 25 }, greeting: 'Привет! Ты же новенький? Я Он-джо. Ты уже знаешь, где столовая?' },
  suhyeok: { id: 'suhyeok', name: 'Ли Су-хёк', shortName: 'Су-хёк', photo: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=faces', handle: '@suhyeok_', desc: 'Молчаливый защитник. Спокойный и уверенный.', initialRelationships: { friendship: 10, trust: 5, respect: 20, sympathy: 5, romance: 0, irritation: 0, hostility: 0, familiarity: 15 }, greeting: 'Привет. Я Су-хёк. Не парься, я не кусаюсь.' },
  namra: { id: 'namra', name: 'Чхве Нам-ра', shortName: 'Нам-ра', photo: 'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=200&h=200&fit=crop&crop=faces', handle: '@namra_classrep', desc: 'Холодная и умная. Знает всё и всех.', initialRelationships: { friendship: 0, trust: 5, respect: 15, sympathy: 0, romance: 0, irritation: 0, hostility: 0, familiarity: 10 }, greeting: 'Ты новенький. Я староста класса. Если есть вопросы — спрашивай.' },
  daesu: { id: 'daesu', name: 'Ян Дэ-су', shortName: 'Дэ-су', photo: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200&h=200&fit=crop&crop=faces', handle: '@daesu_eats', desc: 'Обожает еду. Смешной и добродушный.', initialRelationships: { friendship: 30, trust: 20, respect: 5, sympathy: 20, romance: 0, irritation: 0, hostility: 0, familiarity: 25 }, greeting: 'Йоу! Я Дэ-су. Ты случайно не принёс что-нибудь поесть? А то я умираю с голоду.' },
  jimin: { id: 'jimin', name: 'Ким Джи-мин', shortName: 'Джи-мин', photo: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=200&h=200&fit=crop&crop=faces', handle: '@jimin_sarcasm', desc: 'Сарказм 100 уровня. Но преданная подруга.', initialRelationships: { friendship: 15, trust: 10, respect: 10, sympathy: 10, romance: 0, irritation: 0, hostility: 0, familiarity: 20 }, greeting: 'Ага, новенький. Я Джи-мин. Сразу предупреждаю: я саркастичная и невыносимая.' },
  hari: { id: 'hari', name: 'Чан Ха-ри', shortName: 'Ха-ри', photo: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&crop=faces', handle: '@hari_teamcap', desc: 'Спортивная, лидер. Справедливость превыше всего.', initialRelationships: { friendship: 20, trust: 15, respect: 20, sympathy: 10, romance: 0, irritation: 0, hostility: 0, familiarity: 20 }, greeting: 'Привет. Я Ха-ри, староста и капитан команды. Если хочешь в секцию — поговорим.' },
  nayeon: { id: 'nayeon', name: 'Ли На-ён', shortName: 'На-ён', photo: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=200&h=200&fit=crop&crop=faces', handle: '@nayeon_rich', desc: 'Высокомерная. Думает, что весь мир ей должен.', initialRelationships: { friendship: -10, trust: -15, respect: 0, sympathy: -20, romance: -30, irritation: 15, hostility: 10, familiarity: 5 }, greeting: 'Ты кто вообще? Я тебя не знаю. Не мешайся.' },
  gwinam: { id: 'gwinam', name: 'Юн Гви-нам', shortName: 'Гви-нам', photo: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200&h=200&fit=crop&crop=faces&sat=-100', handle: '@gwinam_', desc: 'Опасный. Агрессивный. Лучше не злить.', initialRelationships: { friendship: -40, trust: -50, respect: -20, sympathy: -60, romance: -80, irritation: 70, hostility: 60, familiarity: 10 }, greeting: 'Какого чёрта тебе надо?' }
};
const WORLD_LOCATIONS = [
  { id: 'class', name: 'Класс 2-3', icon: '🏫', desc: 'Твой класс. Парты, доска.', npcs: ['cheongsan', 'onjo', 'namra', 'jimin'] },
  { id: 'canteen', name: 'Столовая', icon: '🍱', desc: 'Шумно, пахнет едой.', npcs: ['daesu', 'hari'] },
  { id: 'gym', name: 'Спортзал', icon: '🏀', desc: 'Скрип кроссовок.', npcs: ['suhyeok', 'hari'] },
  { id: 'roof', name: 'Крыша', icon: '🌇', desc: 'Ветер, город внизу.', npcs: ['suhyeok', 'namra'] },
  { id: 'corridor', name: 'Коридор', icon: '🚶', desc: 'Шкафчики, гул голосов.', npcs: ['gwinam', 'nayeon', 'daesu'] }
];
const REL_KEYS = ['friendship', 'trust', 'respect', 'sympathy', 'romance', 'irritation', 'hostility', 'familiarity'];
const REL_LABELS = { friendship: 'Дружба', trust: 'Доверие', respect: 'Уважение', sympathy: 'Симпатия', romance: 'Романтика', irritation: 'Раздражение', hostility: 'Враждебность', familiarity: 'Знакомство' };
function getCharacter(id) { return CHARACTERS[id]; }
function getCharacterList() { return Object.values(CHARACTERS); }
function getLocation(id) { return WORLD_LOCATIONS.find(l => l.id === id); }
function clamp(v, min = -100, max = 100) { return Math.max(min, Math.min(max, v | 0)); }
function applyRelationshipChanges(current, changes) { const result = { ...current }; if (!changes) return result; for (const k of REL_KEYS) { if (typeof changes[k] === 'number' && changes[k] !== 0) result[k] = clamp((result[k] || 0) + clamp(changes[k], -5, 5)); } return result; }
const SAVE_KEY = 'hyosan_save_v3';
function getDefaultSave() { const npcs = {}; for (const c of getCharacterList()) npcs[c.id] = { relationships: { ...c.initialRelationships }, messages: [], memories: [], worldScenes: {} }; return { version: 3, player: { name: 'Игрок' }, npcs, instagram: { posts: seedIG() }, twitter: { tweets: seedTW() } }; }
function seedIG() { const now = Date.now(); return [ { id: 'p1', authorId: 'daesu', img: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&h=600&fit=crop', caption: 'Обед — это святое.', ts: now-3600000, likes: 12, likedByMe: false, comments: [{ id: 'c1', authorId: 'jimin', text: 'опять ты про еду', ts: now-3500000 }] }, { id: 'p2', authorId: 'onjo', img: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=600&h=600&fit=crop', caption: 'Контрольная завтра 😭', ts: now-7200000, likes: 24, likedByMe: false, comments: [] } ]; }
function seedTW() { const now = Date.now(); return [ { id: 't1', authorId: 'jimin', text: 'кто решил, что контрольная завтра?', ts: now-1800000, likes: 18, likedByMe: false, replies: [{ id: 'r1', authorId: 'daesu', text: 'учитель сказал вчера', ts: now-1700000 }] } ]; }
function loadSave() { try { const raw = localStorage.getItem(SAVE_KEY); if (!raw) return null; const data = JSON.parse(raw); if (data.version !== 3) return null; return data; } catch { return null; } }
function saveSave(data) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {} }
function getNpcState(save, npcId) { if (!save.npcs[npcId]) { const c = getCharacter(npcId); save.npcs[npcId] = { relationships: { ...c.initialRelationships }, messages: [], memories: [], worldScenes: {} }; } return save.npcs[npcId]; }
const state = { view: 'home', currentNpcId: null, worldLocId: null, worldNpcId: null, save: null, sending: false };
const screenEl = document.getElementById('screen');
document.addEventListener('DOMContentLoaded', () => { state.save = loadSave(); if (!state.save) { state.save = getDefaultSave(); saveSave(state.save); } attachTabs(); render(); });
function attachTabs() { document.querySelectorAll('.tab').forEach(tab => { tab.addEventListener('click', () => { state.view = tab.dataset.tab; updateTabs(state.view); render(); }); }); }
function updateTabs(active) { document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === active)); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
function render() { switch (state.view) { case 'home': return renderHome(); case 'chats': return renderChatList(); case 'chat': return renderChat(); case 'profile': return renderProfile(); case 'instagram': return renderInstagram(); case 'twitter': return renderTwitter(); case 'world': return renderWorldLocations(); case 'world_location': return renderWorldLocation(); case 'world_scene': return renderWorldScene(); } }

function renderHome() {
  let html = `<div class="home-header"><h2>Привет, Игрок!</h2><p>День 1 • Хёсан</p></div><div class="home-grid">`;
  const apps = [ { id: 'chats', name: 'Telegram', icon: '✈️', css: 'tg' }, { id: 'instagram', name: 'Instagram', icon: '📷', css: 'ig' }, { id: 'twitter', name: 'Twitter / X', icon: '𝕏', css: 'tw' }, { id: 'profile_stats', name: 'Stats', icon: '📊', css: 'stats' }, { id: 'world', name: 'Школа', icon: '🏫', css: 'tg' } ];
  for (const app of apps) html += `<div class="app-icon-wrapper" data-app="${app.id}"><div class="app-icon ${app.css}">${app.icon}</div><div class="app-name">${app.name}</div></div>`;
  html += `</div>`; screenEl.innerHTML = html;
  screenEl.querySelectorAll('.app-icon-wrapper').forEach(el => el.addEventListener('click', () => { if (el.dataset.app === 'profile_stats') { state.view = 'profile'; state.currentNpcId = null; render(); } else { state.view = el.dataset.app; render(); } }));
}

function renderChatList() {
  let html = `<div class="page-header"><h1>Чаты</h1></div><div class="list-container">`;
  for (const c of getCharacterList()) {
    const st = getNpcState(state.save, c.id); const last = st.messages[st.messages.length - 1];
    const preview = last ? (last.role === 'user' ? 'Вы: ' : '') + last.text : c.desc;
    html += `<div class="list-item" data-id="${c.id}"><img class="avatar" src="${c.photo}"><div class="list-info"><div class="list-name">${c.name}</div><div class="list-desc">${escapeHtml(preview).slice(0, 40)}</div></div></div>`;
  }
  html += `</div>`; screenEl.innerHTML = html;
  screenEl.querySelectorAll('.list-item').forEach(el => el.addEventListener('click', () => { state.currentNpcId = el.dataset.id; state.view = 'chat'; render(); }));
}

function renderChat() {
  const c = getCharacter(state.currentNpcId); const st = getNpcState(state.save, state.currentNpcId);
  if (st.messages.length === 0) { st.messages.push({ role: 'npc', text: c.greeting, ts: Date.now() }); saveSave(state.save); }
